<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRIDSEC | Dedicated Attack Simulator &amp; Real-Time Demonstration</title>

  <!-- Fonts: Plus Jakarta Sans & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>

  <!-- Top Header -->
  <header class="soc-header">
    <div class="soc-brand">
      <a href="app.html#dashboard" class="logo-icon" style="text-decoration:none;">
        <i class="fa-solid fa-crosshairs" style="color:#dc2626;"></i>
      </a>
      <div class="soc-title-group">
        <h1>GRIDSEC Attack Simulator</h1>
        <p>National Power Grid Cyber Resilience &bull; Dynamic Threat Demonstration Lab</p>
      </div>
    </div>

    <div class="soc-status-group">
      <!-- Safety Status Badge -->
      <div class="soc-status-badge" style="background:#fee2e2; border-color:#fca5a5;">
        <span class="status-dot critical"></span>
        <span style="color:#991b1b; font-weight:700;">Sandbox Isolation Active</span>
      </div>

      <!-- Live SCADA Sync -->
      <div class="soc-status-badge">
        <span class="status-dot healthy"></span>
        <span id="headerSyncStatus">Live SCADA (50.000 Hz)</span>
      </div>

      <a href="app.html#dashboard" class="btn btn-secondary" style="padding:0.35rem 0.75rem; font-size:0.8rem;">
        <i class="fa-solid fa-gauge-high"></i> Operations Dashboard
      </a>

      <a href="index.html" class="btn btn-secondary" style="padding:0.35rem 0.75rem; font-size:0.8rem;">
        <i class="fa-solid fa-house"></i> Home
      </a>
    </div>
  </header>

  <!-- Main Viewport for Attack Simulator -->
  <main id="socMainViewport" class="soc-viewport" style="max-width:1440px; margin:0 auto; padding:1.25rem;">
    <!-- Rendered dynamically by SimulatorView -->
  </main>

  <!-- DSA Details Modal -->
  <div id="dsaModalBackdrop" class="soc-modal-backdrop" onclick="if(event.target === this) window.app.closeDsaModal()">
    <div class="soc-modal">
      <div class="modal-header">
        <h3 id="modalDsaTitle" style="font-size:1.05rem; color:#1c1917;">Algorithm Architecture</h3>
        <button class="btn btn-secondary" style="padding:0.25rem 0.5rem;" onclick="window.app.closeDsaModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="modalDsaBody" class="modal-body">
        <!-- Populated via JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="window.app.closeDsaModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="js/data/gridData.js"></script>
  <script src="js/data/indiaGridData.js"></script>
  <script src="js/data/threatData.js"></script>
  <script src="js/engine/graph.js"></script>
  <script src="js/engine/dsaEngine.js"></script>
  <script src="js/views/simulatorView.js"></script>
  <script src="js/interactions.js"></script>
  
  <script>
    // Lightweight orchestrator for standalone Attack Simulator page
    window.app = {
      graph: new GridGraph(),
      dsaEngine: null,
      showDsaModal: function(type) {
        const modal = document.getElementById("dsaModalBackdrop");
        const title = document.getElementById("modalDsaTitle");
        const body = document.getElementById("modalDsaBody");
        if (!modal || !title || !body) return;

        const descriptions = {
          "hash_table": { title: "O(1) Multi-Key Hash Table", text: "Maps asset identifiers across SCADA aliases, substation tags, and line designations in constant average time O(1)." },
          "bfs": { title: "O(V+E) BFS Cyber Blast Radius", text: "Traverses reachable network topology hops from the compromised entry point to calculate total MW capacity exposed." },
          "dfs": { title: "O(V+E) DFS Island Detection", text: "Identifies disconnected electrical components and verifies grid synchronism after branch trip events." },
          "priority_queue": { title: "O(log N) Max-Heap Incident Triage", text: "Continuously ranks incoming cyber security incidents by severity weight, blast radius, and asset criticality." },
          "dijkstra": { title: "O((V+E) log V) Dijkstra Alternate Route", text: "Calculates the lowest-impedance path around disconnected branch corridors to safely reroute power." }
        };

        const dsa = descriptions[type] || { title: "DSA Algorithm", text: "Computational algorithm for power grid resilience." };
        title.textContent = dsa.title;
        body.innerHTML = `<p style="font-size:0.85rem; color:#334155; line-height:1.5;">${dsa.text}</p>`;
        modal.style.display = "flex";
      },
      closeDsaModal: function() {
        const modal = document.getElementById("dsaModalBackdrop");
        if (modal) modal.style.display = "none";
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      window.app.graph.loadData(window.GRID_DATA);
      window.app.dsaEngine = new DsaEngine(window.app.graph);

      const viewport = document.getElementById("socMainViewport");
      if (viewport && window.SimulatorView) {
        viewport.innerHTML = window.SimulatorView.render(window.app);
      }
    });
  </script>
</body>
</html>
